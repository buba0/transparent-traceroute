# traceroute-geoip configuration
#
# Copy this file to config.ini and fill in your own details:
#     cp config.example.ini config.ini          (Linux / macOS)
#     copy config.example.ini config.ini        (Windows)
#
# config.ini is listed in .gitignore, so your credentials are never committed.
# Only config.example.ini (this file, with no real secrets) goes into git.
#
# The script looks for config.ini next to traceroute_geoip.py.
# Use  --config PATH  to point it somewhere else.

[database]
host = 127.0.0.1
port = 3306
user = your_db_user
password = your_db_password
name = geoip

[tables]
# Tables are searched in order; the first match wins. Put a smaller,
# more detailed table first (e.g. a single country), then the global one.
# An IPv6 table that doesn't exist is simply skipped.
ipv4 = pl_ipv4,all_ipv4
ipv6 = pl_ipv6,all_ipv6
